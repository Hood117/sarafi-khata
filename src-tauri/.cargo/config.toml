# Windows MSVC: SQLITE3_* is set by scripts/run-tauri-msvc.bat so the
# prebuilt vendor/sqlite/sqlite3.lib is linked (avoids flaky sqlite3.c
# compile with exit 259). Do not set those env vars here — they break
# macOS/Linux builds (MSVC .lib is not a Mach-O/ELF archive).
#
# Non-Windows: rusqlite `bundled` feature compiles SQLite from source.
#
# Rebuild Windows lib: scripts\build-sqlite-msvc.bat or
# src-tauri\vendor\sqlite\build.bat
