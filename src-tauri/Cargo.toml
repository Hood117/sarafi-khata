[package]
name = "saraf"
version = "0.1.0"
description = "Offline Sarafi Management System"
authors = ["Saraf"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "saraf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# SQLite via vendored static lib (src-tauri/vendor/sqlite) — see .cargo/config.toml.
# Avoids compiling sqlite3.c inside cargo on Windows (MSVC build-script exit 259).
rusqlite = { version = "0.32", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.17"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
