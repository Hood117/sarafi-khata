[package]
name = "saraf"
version = "1.0.0"
description = "Offline Sarafi Management System"
authors = ["Saraf"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "saraf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
# SQLite via vendored static lib (src-tauri/vendor/sqlite) — see .cargo/config.toml.
# Avoids compiling sqlite3.c inside cargo on Windows (MSVC build-script exit 259).
rusqlite = { version = "0.32", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.17"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rfd = "0.15"
# Sync HTTP for license activation only (APP_TOKEN never leaves Rust).
# native-tls (not rustls/ring) — ring's MSVC build-script often exits 259
# (STILL_ACTIVE) on Windows, same class of issue as compiling sqlite3.c.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json", "proxy-from-env"] }

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
# Win32 printer enumeration (EnumPrinters / DeviceCapabilities) — no vendor SDKs.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Printing",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_Xps",
] }

# Production builds must enable custom-protocol so cfg(dev) is false and the
# app loads embedded SPA assets instead of http://127.0.0.1:1421.
# `tauri dev` disables this feature; `tauri build` / plain cargo release keep it.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

