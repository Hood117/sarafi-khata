<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASMS — Afghan Sarafi Management System</title>
    <script>
      (function () {
        try {
          var size = localStorage.getItem("saraf.ui.fontSize");
          var bold = localStorage.getItem("saraf.ui.boldText");
          var family = localStorage.getItem("saraf.ui.fontFamily");
          var html = document.documentElement;
          if (size === "small" || size === "default" || size === "large" || size === "extra-large") {
            html.setAttribute("data-font-size", size);
          } else {
            html.setAttribute("data-font-size", "default");
          }
          if (bold === "true") html.setAttribute("data-bold-text", "true");
          if (family === "tajawal" || family === "cairo" || family === "default") {
            html.setAttribute("data-font-family", family);
          } else {
            html.setAttribute("data-font-family", "default");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
